<app-page-layout
      title="Hébergement – Familles d’accueil"
      description="Capacités et affectations"
    >
      <tui-tabs [(activeItemIndex)]="view"
        ><button tuiTab type="button">Table</button>
        <button tuiTab type="button">Cards</button>
        <button tuiTab routerLink="/hebergement/carte">🗺 Carte</button>
        <button tuiTab routerLink="/hebergement/placement">🏠 Placement</button>
      </tui-tabs>
      @if (view < 2) {
        <app-group-bulk-bar
          [groups]="groups()"
          [checkedIds]="checkedIds()"
          (cleared)="clearChecked()"
          (changed)="reloadFamilies()"
        />
      }
      @if (loading()) {
        <tui-loader />
      } @else if (view === 0) {
        <app-data-table
          [rows]="families()"
          [columns]="tableColumns"
          [selectable]="true"
          [checkedIds]="checkedIds()"
          (checkedChange)="setChecked($event)"
          (rowSelected)="select($event)"
        />
      } @else {
        <app-host-family-cards
          [families]="families()"
          [groupNames]="groupNames()"
          [checkedIds]="checkedIds()"
          (checkedChange)="setChecked($event)"
          (selectFamily)="select($event)"
        />
      }
    </app-page-layout>
    @if (selectedFamily()) {
      <app-host-family-detail-drawer
        [family]="selectedFamily()"
        [assignments]="selectedFamilyAssignments()"
        [groups]="groups()"
        [groupError]="groupError()"
        [groupVersion]="groupVersion()"
        (groupChange)="changeFamilyGroup($event)"
        (drawerClosed)="closeDrawer()"
        (changed)="reloadAssignments()"
      />
    }
