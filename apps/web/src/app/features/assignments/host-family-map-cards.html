<div class="cards">
  @for (item of families(); track item.family.id) {
    <div class="card-wrap">
    <button
      type="button"
      class="family-card"
      [class.family-card--active]="item.family.id === selectedFamilyId() || checkedIds().has(item.family.id)"
      [attr.aria-pressed]="selectMode() ? checkedIds().has(item.family.id) : null"
      [style.border-left]="'6px solid ' + groupTone(item)"
      [id]="'family-card-' + item.family.id"
      (click)="selectFamily.emit(item.family.id)"
    >
      <header>
        <strong>{{ selectMode() ? (checkedIds().has(item.family.id) ? '☑ ' : '☐ ') : '' }}{{ item.family.familyName }}</strong>
        <span size="s" tuiBadge [appearance]="badgeAppearance(item.capacityState)">
          {{ capacityLabel(item.capacityState) }}
        </span>
      </header>
      <p class="meta">
        {{ item.family.city }} · {{ item.family.parish || 'Sans paroisse' }} · {{ item.sector }}
      </p>
      <p class="meta">
        {{ item.assignmentsCount }}/{{ item.family.maxCapacity }} places ·
        {{ item.under18Count }}/{{ item.family.maxUnder18 }}
        mineurs
      </p>
      <p class="meta">{{ item.collective ? 'Hébergement collectif' : 'Famille d\'accueil' }} · Groupe : {{ item.group ? item.group.name : 'aucun' }}</p>
      @if (item.distanceKm !== null) {
        <p class="meta">Distance: {{ formatDistance(item.distanceKm) }} km</p>
      }
      <div class="chips">
        @for (tag of item.family.tags || []; track tag) {
          <span size="s" tuiChip>{{ tag }}</span>
        }
        @for (constraint of item.family.constraints || []; track constraint) {
          <span size="s" tuiChip appearance="warning">{{ constraint }}</span>
        }
      </div>
    </button>
    @if (groups(); as gs) {
      <app-select-field
        class="group-pick"
        label="Groupe"
        icon="@tui.users"
        [testId]="'card-group-' + item.family.id"
        [options]="groupOptions()"
        [value]="item.family.hostingGroupId ?? 0"
        (valueChange)="onGroupPick(item.family.id, $event)"
      />
    }
    </div>
  } @empty {
    <p class="empty">Aucune famille ne correspond aux filtres.</p>
  }
</div>
