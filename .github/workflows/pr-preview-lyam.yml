name: PR Preview (second Render account, image)

# Preview gratuite d'une PR interne : l'API, l'intranet, le site public (/site/) et l'appli mobile (/m/) (une seule image) sur le DEUXIEME compte
# Render (choix d'Emmanuel du 20 nov. 2026). Aucune minute de build Render : l'image est construite
# ici (GitHub Actions) puis Render ne fait que la tirer. Le site public est servi en statique (sans SSR).
#
# Declenchement :
# - label `deploy-preview-lyam` sur la PR (evenement pull_request : le workflow de la PR s'execute
#   AVANT fusion, avec les secrets car la PR est interne) ;
# - workflow_dispatch (Actions > Run workflow, ou le commentaire `/preview2` relaye par pr-previews.yml) :
#   cette version lit alors la branche par defaut, donc disponible APRES fusion.
# Isolation : les scripts qui voient la cle Render viennent du dossier `trusted/` ; le code de la PR
# (dossier `pr/`) ne voit que l'URL de sa propre base Neon. Les PR de fork sont refusees.
# - mode « image seulement » : un commit de la PR dont le message contient `[preview-image-only]`
#   reconstruit l'image sur la tete de la PR et la redeploie sur le service EXISTANT, SANS migration
#   ni seed (les donnees de la base ne bougent pas ; le mot de passe de la branche est regenere et
#   resynchronise). Un push ordinaire ne declenche rien. Si le service n'existe pas, le mode refuse.
on:
  pull_request:
    types: [labeled, closed, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: PR interne a (re)deployer
        required: true
        type: number

permissions:
  contents: read
  packages: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-preview-lyam-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  preview:
    name: Build the image and deploy the free preview
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'synchronize' &&
       github.event.pull_request.number != 42 &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event.action == 'labeled' && github.event.label.name == 'deploy-preview-lyam' &&
       github.event.pull_request.number != 42 &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Read the PR from the GitHub API (never from event metadata)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$PR_NUMBER" != "42" ] || { echo "PR 42 has its own workflow"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > pr.json
          [ "$(jq -r .state pr.json)" = "open" ] || { echo "PR is not open"; exit 1; }
          [ "$(jq -r .head.repo.full_name pr.json)" = "${GITHUB_REPOSITORY}" ] || { echo "fork PR refused"; exit 1; }
          echo "sha=$(jq -r .head.sha pr.json)" >> "$GITHUB_OUTPUT"
          echo "repo=$(jq -r .head.repo.full_name pr.json)" >> "$GITHUB_OUTPUT"
          run=true; image_only=false
          if [ "${{ github.event.action }}" = "synchronize" ]; then
            run=false
            msg=$(gh api "repos/${GITHUB_REPOSITORY}/commits/$(jq -r .head.sha pr.json)" --jq .commit.message)
            case "$msg" in *'[preview-image-only]'*) run=true; image_only=true ;; esac
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "image_only=$image_only" >> "$GITHUB_OUTPUT"

      - name: Trusted scripts (PR head before merge, default branch otherwise)
        if: steps.pr.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && steps.pr.outputs.sha || github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: PR code (built and seeded without any Render key)
        if: steps.pr.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.sha }}
          path: pr
          persist-credentials: false

      - uses: actions/setup-node@v5
        if: steps.pr.outputs.run == 'true'
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: pr/package-lock.json

      - name: Neon branch of this PR (existing branch is reused)
        if: steps.pr.outputs.run == 'true'
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: preview/main
          branch_name: preview/pr-${{ env.PR_NUMBER }}

      - name: Fresh credentials for the PR Neon branch
        if: steps.pr.outputs.run == 'true'
        id: creds
        working-directory: trusted
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          NEON_DB_URL: ${{ steps.neon.outputs.db_url_pooled }}
          NEON_DB_URL_DIRECT: ${{ steps.neon.outputs.db_url }}
        run: node scripts/neon-branch-credentials.mjs

      - name: Install, migrate and seed the PR database (fictional data)
        if: steps.pr.outputs.run == 'true' && steps.pr.outputs.image_only != 'true'
        working-directory: pr
        env:
          DATABASE_URL: ${{ steps.creds.outputs.db_url_pooled }}
          DATABASE_URL_DIRECT: ${{ steps.creds.outputs.db_url }}
          DB_SSL: 'true'
        run: |
          npm ci
          npm run migration:run
          npx tsx apps/api/src/database/seeds/seed.ts --profile=medium

      - uses: docker/setup-buildx-action@v3
        if: steps.pr.outputs.run == 'true'
      - uses: docker/login-action@v3
        if: steps.pr.outputs.run == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the API + intranet image, no latest tag
        if: steps.pr.outputs.run == 'true'
        id: image
        uses: docker/build-push-action@v6
        with:
          context: pr
          file: pr/Dockerfile.preview
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:preview-pr${{ env.PR_NUMBER }}-${{ steps.pr.outputs.sha }}
          cache-from: type=gha,scope=pr-preview-lyam
          cache-to: type=gha,mode=max,scope=pr-preview-lyam

      - name: Create or update only the free image service in the second account
        if: steps.pr.outputs.run == 'true'
        id: deploy
        working-directory: trusted
        env:
          PREVIEW_HEAD_REPO: ${{ steps.pr.outputs.repo }}
          PREVIEW_IMAGE_ONLY: ${{ steps.pr.outputs.image_only }}
          RENDER_LYAM_PREVIEW_API_KEY: ${{ secrets.RENDER_LYAM_PREVIEW_API_KEY }}
          FAMILY_RESEND_API_KEY: ${{ secrets.FAMILY_RESEND_API_KEY }}
          PREVIEW_DB_URL: ${{ steps.creds.outputs.db_url_pooled }}
          PREVIEW_DB_URL_DIRECT: ${{ steps.creds.outputs.db_url }}
          PREVIEW_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
        run: node scripts/render-pr-lyam.mjs

      - name: Post the preview links on the PR
        if: steps.pr.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ steps.deploy.outputs.comment }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$COMMENT"

  cleanup:
    name: Delete the free preview when the PR closes
    if: github.event.action == 'closed' && github.event.pull_request.number != 42 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
      - name: Delete only the verified al-pr<N>-api free image service
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RENDER_LYAM_PREVIEW_API_KEY: ${{ secrets.RENDER_LYAM_PREVIEW_API_KEY }}
        run: node scripts/render-pr-lyam-cleanup.mjs
