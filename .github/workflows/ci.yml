name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build applications
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Test the Render orchestration scripts
        run: node --test scripts/*.test.mjs

      - name: Build public site and mobile PWA
        run: |
          npm run build:site
          npm run build:mobile

  api-auth-smoke:
    name: API auth smoke test (fictitious data)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mej_user
          POSTGRES_PASSWORD: mej_password
          POSTGRES_DB: mej_allegria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mej_user -d mej_allegria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: development
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: mej_allegria
      DB_USER: mej_user
      DB_PASSWORD: mej_password
      PORT: '3000'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build:api

      - name: Migrate and seed (fictitious data)
        run: |
          npm run migration:run
          npm run seed:api:small

      # Rejoue de bout en bout le chemin /preview de la PR39 : le wrapper
      # n'accepte que la combinaison exacte branche/service, prouve la base
      # fictive, exécute le seed documentaire réel et compte les fiches.
      - name: Seed documentaire demo (chemin /preview simule)
        run: npm run seed:preview-demo
        env:
          RENDER: 'true'
          RENDER_GIT_BRANCH: feature/consignes-docs
          RENDER_SERVICE_NAME: al-pr39-api

      - name: Start API and check authentication
        run: |
          node dist/apps/api/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health >/dev/null && break
            sleep 2
          done
          API_URL=http://localhost:3000 node scripts/check-api-auth.mjs || { cat api.log; exit 1; }

      - name: Check hosting placement (real database, fictitious data)
        run: |
          node dist/apps/api/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health >/dev/null && break
            sleep 2
          done
          API_URL=http://localhost:3000 node scripts/check-hosting-placement.mjs || { cat api.log; exit 1; }

      - name: Check QR access control (real database, seed people only)
        run: |
          node dist/apps/api/main.js > api-qr.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health >/dev/null && break
            sleep 2
          done
          API_URL=http://localhost:3000 QR_SMOKE_ALLOW_MUTATION=yes node scripts/check-access-control.mjs || { cat api-qr.log; exit 1; }

      - name: Check QR print and testkit (seed database only)
        run: |
          API_URL=http://localhost:3000 QR_SMOKE_ALLOW_MUTATION=yes node scripts/check-qr-testkit.mjs || { cat api-qr.log; exit 1; }
