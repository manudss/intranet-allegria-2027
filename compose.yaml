services:
  postgres:
    image: postgres:17-alpine
    container_name: mej-allegria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mej_allegria
      POSTGRES_USER: mej_user
      POSTGRES_PASSWORD: mej_password
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mej_user -d mej_allegria']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
