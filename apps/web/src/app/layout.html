<div class="allegria-shell">
  <header tuiNavigationHeader class="allegria-header">
    <div tuiNavigationLogo class="header-left">
      <button
        tuiIconButton
        type="button"
        appearance="flat"
        class="mobile-menu-btn"
        aria-controls="main-navigation"
        [attr.aria-expanded]="isMobileMenuOpen()"
        (click)="toggleMobileMenu()"
      >
        <tui-icon [icon]="isMobileMenuOpen() ? '@tui.x' : '@tui.menu'"></tui-icon>
      </button>
      <img src="assets/logo-allegria.svg" alt="Allegria 2027" class="logo" />
      <div class="header-titles" >
        <span class="header-title" tuiFade>Allegria 2027 - Intranet benevoles</span>
        <h1 class="page-title">{{ currentPageTitle() }}</h1>
      </div>
    </div>

    <div class="header-right">
      <button tuiButton appearance="secondary" type="button">
        <div tuiAvatar="@tui.user"></div>
        <span>{{ auth.currentUser()?.email ?? 'Utilisateur' }}</span>
      </button>
      <button tuiButton appearance="primary" type="button" (click)="logout()">Deconnexion</button>
    </div>
  </header>

  @if (isMobileMenuOpen()) {
  <button
    type="button"
    class="mobile-overlay"
    aria-label="Fermer le menu"
    (click)="closeMobileMenu()"
  ></button>
  }

  <div class="allegria-body">
    <aside
      id="main-navigation"
      class="allegria-sidebar"
      [tuiNavigationAside]="expanded()"
      [class.mobile-open]="isMobileMenuOpen()"
    >
      <header>
        <button iconStart="@tui.home" type="button" [tuiAsideItem]="homeHint">
          <ng-container [ngTemplateOutlet]="homeHint" />

          <ng-template #homeHint>
            <span tuiFade>Allegria 2027</span>
            <div appearance="accent" tuiBadge>Intranet</div>
          </ng-template>
        </button>
      </header>

          @for (group of navGroups; track group.label) {
      <tui-aside-group>
        <button
          tuiAsideItem
          tuiChevron
          type="button"
          [iconStart]="group.icon"
        >
          {{ group.label }}

          <ng-template>
            @for (item of group.items; track item.path) {
            <a
              tuiAsideItem
              [iconStart]="item.icon"
              [routerLink]="item.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="onMenuItemSelect()"
            >
              {{ item.label }}
            </a>
            }
          </ng-template>
        </button>
      </tui-aside-group>
          }

      <hr />

      <footer>
      <button
          tuiAsideItem
          type="button"
          iconStart="@tui.log-out"
          (click)="logout()"
        >
          Déconnexion
        </button>

        <button
          tuiAsideItem
        type="button"
          [iconStart]="expanded() ? '@tui.chevron-left' : '@tui.chevron-right'"
          (click)="handleToggle()"
      >
          {{ expanded() ? 'Réduire' : 'Étendre' }}
      </button>
      </footer>
    </aside>

    <main class="allegria-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
