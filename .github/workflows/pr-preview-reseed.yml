name: PR Preview Reseed

# Reseed manuel de la base Neon d'une preview de PR + redeploiement.
# pr-previews.yml cree la branche preview/pr-<N> (migrations au build Render)
# mais ne la seede jamais. Ajouter le label `reseed-preview` sur la PR lance,
# en un seul declenchement : regeneration des identifiants DB, migrations,
# seed, puis synchro de l'env Render et redeploiement de la preview (le meme
# refresh que /preview). Retirer puis rajouter le label relance le tout.
# Workflow declenche par l'evenement pull_request (label) : il s'execute depuis
# le code de la branche de la PR, avec les secrets du depot (PR interne).

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: preview-reseed-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reseed:
    name: Migrate and reseed the PR preview database
    if: github.event.label.name == 'reseed-preview' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Neon branch of this PR preview (existing branch is reused)
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: preview/main
          branch_name: preview/pr-${{ github.event.pull_request.number }}

      - name: Check Neon outputs
        shell: bash
        run: |
          echo "branch_id=${{ steps.neon.outputs.branch_id }}"
          echo "created=${{ steps.neon.outputs.created }}"
          if [ -z "${{ steps.neon.outputs.db_url }}" ]; then
            echo "Neon db_url output is empty"
            exit 1
          fi

      - name: Check out the PR code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # pr-previews.yml donne a chaque branche PR son propre mot de passe
      # (neon-branch-credentials.mjs) : l'URL sortie par create-branch-action
      # sur une branche existante est perimee. On refait la meme chose ici et
      # l'etape de deploiement ci-dessous synchronise Render avec ce mot de
      # passe frais : une seule rotation, un seul declenchement.
      - name: Fresh DB credentials for the PR Neon branch
        id: creds
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          NEON_DB_URL: ${{ steps.neon.outputs.db_url_pooled }}
          NEON_DB_URL_DIRECT: ${{ steps.neon.outputs.db_url }}
        run: node scripts/neon-branch-credentials.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migration:run
        env:
          DATABASE_URL: ${{ steps.creds.outputs.db_url_pooled }}
          DATABASE_URL_DIRECT: ${{ steps.creds.outputs.db_url }}
          DB_SSL: 'true'

      - name: Reseed (fictitious data, full reset)
        run: npx tsx apps/api/src/database/seeds/seed.ts --profile=medium
        env:
          DATABASE_URL: ${{ steps.creds.outputs.db_url_pooled }}
          DATABASE_URL_DIRECT: ${{ steps.creds.outputs.db_url }}
          DB_SSL: 'true'

      # Meme refresh que le job de pr-previews.yml (/preview) : met a jour
      # l'env Render avec les identifiants frais ci-dessus et redeploie la
      # preview sur le dernier commit de la PR.
      - name: Redeploy the previews on the latest PR commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          RENDER_ENVIRONMENT_ID: ${{ vars.RENDER_ENVIRONMENT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEON_DB_URL: ${{ steps.creds.outputs.db_url_pooled }}
          NEON_DB_URL_DIRECT: ${{ steps.creds.outputs.db_url }}
          NEON_BRANCH_NAME: preview/pr-${{ github.event.pull_request.number }}
        run: node scripts/render-pr-previews.mjs refresh
