<header class="site-header">
  <div class="container site-header__inner">
    <a routerLink="/" class="site-header__brand">
      <span class="site-header__logo" aria-hidden="true">A</span>
      <span>Alegria <strong>2027</strong></span>
    </a>

    <button
      type="button"
      class="site-header__burger"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span class="visually-hidden">{{ menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu' }}</span>
      <span class="site-header__burger-icon" aria-hidden="true">{{ menuOpen() ? '✕' : '☰' }}</span>
    </button>

    <nav
      id="primary-navigation"
      class="site-header__nav"
      [class.site-header__nav--open]="menuOpen()"
      aria-label="Navigation principale"
    >
      <ul>
        @for (link of navLinks; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              (click)="closeMenu()"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>

      <div class="site-header__register">
        <button
          type="button"
          class="btn btn-primary"
          aria-haspopup="true"
          aria-controls="register-menu"
          [attr.aria-expanded]="registerMenuOpen()"
          (click)="toggleRegisterMenu()"
        >
          S’inscrire
        </button>
        @if (registerMenuOpen()) {
          <ul id="register-menu" class="site-header__register-menu" role="menu">
            <li role="none">
              <a role="menuitem" routerLink="/inscription/jeunes" (click)="closeRegisterMenu(); closeMenu()"
                >Je suis un jeune (12-18 ans)</a
              >
            </li>
            <li role="none">
              <a role="menuitem" routerLink="/inscription/familles" (click)="closeRegisterMenu(); closeMenu()"
                >Je suis une famille</a
              >
            </li>
            <li role="none">
              <a role="menuitem" routerLink="/inscription/benevoles" (click)="closeRegisterMenu(); closeMenu()"
                >Je deviens bénévole</a
              >
            </li>
          </ul>
        }
      </div>
    </nav>
  </div>
</header>
