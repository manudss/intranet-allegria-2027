<div class="bar" data-testid="select-bar">
  <span data-testid="checked-count"><strong>{{ checkedIds().size }}</strong> sélectionné(s)</span>
  <button type="button" tuiButton size="s" appearance="flat" [disabled]="!checkedIds().size" (click)="cleared.emit()">Vider</button>
  <app-select-field
    label="Groupe cible"
    placeholder="Choisir un groupe"
    icon="@tui.users"
    testId="target-group"
    [options]="groupOptions()"
    [value]="targetGroupId()"
    (valueChange)="targetGroupId.set($event)"
  />
  <button type="button" tuiButton size="s" data-testid="assign" [disabled]="busy() || !checkedIds().size || targetGroupId() === null" (click)="assign(targetGroupId())">Affecter ({{ checkedIds().size }})</button>
  <button type="button" tuiButton size="s" appearance="secondary" data-testid="unassign" [disabled]="busy() || !checkedIds().size" (click)="assign(null)">Retirer du groupe</button>
</div>
<div class="bar">
  <tui-textfield class="name">
    <label tuiLabel for="new-group-name">Nouveau groupe</label>
    <input
      tuiInput
      id="new-group-name"
      data-testid="new-group-name"
      placeholder="ex. Nord, Paroisse X"
      [ngModel]="newGroupName()"
      (ngModelChange)="newGroupName.set($event)"
    />
  </tui-textfield>
  <app-select-field
    label="Type de groupe"
    [options]="kindOptions"
    [value]="newGroupKind()"
    (valueChange)="newGroupKind.set($event ?? 'ZONE')"
  />
  <button type="button" tuiButton size="s" data-testid="create-assign" [disabled]="busy() || !checkedIds().size || !newGroupName().trim()" (click)="createAndAssign()">Créer et affecter</button>
</div>
@if (feedback(); as f) {
  <p class="feedback" [class.error]="f.error" role="status" data-testid="feedback">{{ f.text }}</p>
}
