<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Alegria 2027 - Intranet des bénévoles</title>
    <base href="/" />
    <script src="appearance-init.js"></script>
    <meta name="theme-color" content="#fffdf9" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/genfavicon-32.png" sizes="32x32">
    <link rel="icon" href="/genfavicon-16.png" sizes="16x16">
    <link rel="apple-touch-icon" href="/apple-touch-icon-57x57.png" sizes="57x57">
    <link rel="apple-touch-icon" href="/apple-touch-icon-114x114.png" sizes="114x114">
    <link rel="apple-touch-icon" href="/apple-touch-icon-120x120.png" sizes="120x120">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180">
    <link rel="manifest" href="/site.webmanifest">
  </head>
  <body>
    <app-root>
      <!-- Squelette affiché avant le démarrage de l'application (remplacé automatiquement). -->
      <style>
        .boot-sk { padding: 1rem; display: grid; gap: 0.75rem; max-width: 72rem; margin: 0 auto; }
        .boot-sk i { display: block; border-radius: 0.5rem; background: linear-gradient(90deg, #ececf1 25%, #f6f6f9 50%, #ececf1 75%); background-size: 200% 100%; animation: boot-sk 1.2s linear infinite; }
        @keyframes boot-sk { to { background-position: -200% 0; } }
        @media (prefers-reduced-motion: reduce) { .boot-sk i { animation: none; } }
      </style>
      <div class="boot-sk" role="status" aria-label="Chargement en cours">
        <i style="height: 3rem"></i>
        <i style="height: 2rem; width: 40%"></i>
        <i style="height: 3rem"></i>
        <i style="height: 12rem"></i>
      </div>
    </app-root>
  </body>
</html>
